name: Plato
description: 'Plato was a mentorship and leadership community for engineering leaders (platohq.com), operating
  from 2018 until its sunset on December 19, 2025. It ran a global network of 500+ engineering leaders and
  1,000+ mentors, the annual Elevate conference, and dozens of meetups, webinars, and dinners. Its parent
  company Coda was acquired by Grammarly (rebranded Superhuman), which wound down Plato''s programs to focus
  on an AI-native productivity suite. The company is now deactivated: platohq.com redirects to a Substack
  sunset announcement and no developer API, SDK, documentation, or integrations are or were published.
  Surfaced as a partech portfolio lead; enrichment found no API surface.'
